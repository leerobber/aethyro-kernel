[package]
name = "aethyro-ntg-kernel"
version = "0.1.0"
edition = "2021"

[dependencies]
sha2 = "0.10"
memmap2 = "0.9"
flate2 = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.7"

[dev-dependencies]
criterion = "0.5"

[features]
default = []
cuda = []  # Enable CUDA GPU acceleration for Brain δ/γ

[lib]
name = "ntg_kernel"
crate-type = ["cdylib", "rlib"]

[profile.release]
lto = true
codegen-units = 1

[[bench]]
name = "simd_benchmark"
harness = false

[[bin]]
name = "kernel_host"
path = "src/main.rs"

[[bin]]
name = "density_bench"
path = "src/bin/density_bench.rs"

[[bin]]
name = "graph_overhead_bench"
path = "src/bin/graph_overhead_bench.rs"

[[bin]]
name = "gemm_bench"
path = "src/bin/gemm_bench.rs"

[[bin]]
name = "edge_relatedness_bench"
path = "src/bin/edge_relatedness_bench.rs"

[[bin]]
name = "phase4_calib"
path = "src/bin/phase4_calib.rs"

[[bin]]
name = "ntg_school"
path = "src/bin/ntg_school.rs"

[[bin]]
name = "vcf_to_csv"
path = "src/bin/vcf_to_csv.rs"

[[bin]]
name = "compute_ld"
path = "src/bin/compute_ld.rs"

[[bin]]
name = "compute_ld_fast"
path = "src/bin/compute_ld_fast.rs"

[[bin]]
name = "genomic_brain"
path = "src/bin/genomic_brain.rs"

[[bin]]
name = "load_brain_from_csv"
path = "src/bin/load_brain_from_csv.rs"

[[bin]]
name = "train_genomic_brain"
